allowBuilds:
  # @parcel/watcher + @swc/core arrive as optional deps of next-intl (its
  # build-time SWC plugin + file watcher), which this setup never uses. Skip
  # their native builds to silence pnpm 11's ERR_PNPM_IGNORED_BUILDS gate so
  # `pnpm install` doesn't exit 1 on CI or in the image build.
  '@parcel/watcher': false
  '@swc/core': false
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
# @motir/design-system is Motir's own package, published from motir-core; the
# starter tracks the version motir-core validates design choices against, so a
# fresh release is installed the day it lands (MOTIR-10048).
minimumReleaseAgeExclude:
  - '@motir/design-system'
